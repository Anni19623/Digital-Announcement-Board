<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Campus Notice Hub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0a1628;
        --blue: #1565c0;
        --cyan: #00bcd4;
        --cyan-light: #80deea;
        --white: #ffffff;
        --gray-50: #f8fafc;
        --gray-100: #eef2f7;
        --gray-200: #e2e8f0;
        --gray-400: #94a3b8;
        --gray-600: #475569;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background: var(--navy);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      .bg-shapes {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .bshape {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.15;
      }
      .bshape-1 {
        width: 500px;
        height: 500px;
        background: var(--blue);
        top: -100px;
        right: -100px;
        animation: drift 12s ease-in-out infinite;
      }
      .bshape-2 {
        width: 400px;
        height: 400px;
        background: var(--cyan);
        bottom: -100px;
        left: -100px;
        animation: drift 10s ease-in-out infinite reverse;
      }
      .bshape-3 {
        width: 250px;
        height: 250px;
        background: #7c4dff;
        top: 50%;
        left: 50%;
        animation: drift 8s ease-in-out infinite;
      }
      @keyframes drift {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(20px, -20px) scale(1.05);
        }
        66% {
          transform: translate(-15px, 15px) scale(0.97);
        }
      }
      .grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 50px 50px;
        pointer-events: none;
      }
      .login-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 440px;
        padding: 20px;
      }
      .login-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4);
        animation: slideUp 0.6s ease both;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .login-logo {
        text-align: center;
        margin-bottom: 32px;
      }
      .login-logo-icon {
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, var(--cyan), #1976d2);
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin-bottom: 14px;
        box-shadow: 0 8px 32px rgba(0, 188, 212, 0.25);
      }
      .login-logo h1 {
        font-family: "Sora", sans-serif;
        font-size: 22px;
        font-weight: 800;
        color: var(--white);
        letter-spacing: -0.5px;
      }
      .login-logo h1 span {
        color: var(--cyan);
      }
      .login-logo p {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.45);
        margin-top: 4px;
      }
      .login-divider {
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.3);
        margin-bottom: 24px;
        padding: 12px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 8px;
      }
      .form-group .input-wrap {
        position: relative;
      }
      .form-group .input-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
        opacity: 0.5;
      }
      .form-group input {
        width: 100%;
        padding: 13px 14px 13px 42px;
        background: rgba(255, 255, 255, 0.06);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: var(--white);
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        outline: none;
        transition: all 0.25s;
      }
      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.25);
      }
      .form-group input:focus {
        border-color: var(--cyan);
        background: rgba(0, 188, 212, 0.06);
        box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.1);
      }
      .show-toggle {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        font-size: 16px;
      }
      .remember-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      .remember-row label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.5);
        cursor: pointer;
      }
      .remember-row input[type="checkbox"] {
        accent-color: var(--cyan);
        width: 15px;
        height: 15px;
      }
      .forgot {
        font-size: 13px;
        color: var(--cyan);
        text-decoration: none;
        opacity: 0.8;
      }
      .forgot:hover {
        opacity: 1;
      }
      .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--cyan), #1976d2);
        border: none;
        border-radius: 12px;
        color: var(--white);
        font-family: "Sora", sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
      }
      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(0, 188, 212, 0.3);
      }
      .login-btn:active {
        transform: translateY(0);
      }
      .login-btn.loading {
        pointer-events: none;
      }
      .error-msg {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        font-size: 13px;
        padding: 10px 14px;
        border-radius: 10px;
        margin-bottom: 16px;
        display: none;
        align-items: center;
        gap: 8px;
      }
      .hint-box {
        background: rgba(0, 188, 212, 0.08);
        border: 1px solid rgba(0, 188, 212, 0.2);
        border-radius: 12px;
        padding: 14px 16px;
        margin-top: 20px;
      }
      .hint-box p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.45);
        line-height: 1.6;
      }
      .hint-box strong {
        color: var(--cyan-light);
      }
      .back-link {
        text-align: center;
        margin-top: 20px;
      }
      .back-link a {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.4);
        text-decoration: none;
        transition: color 0.2s;
      }
      .back-link a:hover {
        color: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <div class="bg-shapes">
      <div class="bshape bshape-1"></div>
      <div class="bshape bshape-2"></div>
      <div class="bshape bshape-3"></div>
    </div>
    <div class="grid"></div>

    <div class="login-container">
      <div class="login-card">
        <div class="login-logo">
          <div class="login-logo-icon">🛡️</div>
          <h1>Campus<span>Hub</span> Admin</h1>
          <p>Restricted access — authorized personnel only</p>
        </div>
        <div class="login-divider">Sign in to your account</div>

        <div class="error-msg" id="errorMsg">
          ⚠️ <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input
              type="text"
              id="username"
              placeholder="Enter admin username"
              autocomplete="username"
            />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔒</span>
            <input
              type="password"
              id="password"
              placeholder="Enter password"
              autocomplete="current-password"
              onkeydown="if (event.key === 'Enter') doLogin();"
            />
            <button class="show-toggle" onclick="togglePass()" id="showToggle">
              👁️
            </button>
          </div>
        </div>
        <div class="remember-row">
          <label><input type="checkbox" checked /> Remember me</label>
          <a href="#" class="forgot">Forgot password?</a>
        </div>
        <button class="login-btn" id="loginBtn" onclick="doLogin()">
          🔐 Sign In to Admin Panel
        </button>

        <div class="hint-box">
          <p>
            Demo credentials — Username: <strong>admin</strong> · Password:
            <strong>campus123</strong>
          </p>
        </div>
        <div class="back-link"><a href="index.html">← Back to Homepage</a></div>
      </div>
    </div>

    <script>
      function togglePass() {
        const inp = document.getElementById("password");
        inp.type = inp.type === "password" ? "text" : "password";
      }

      function doLogin() {
        const user = document.getElementById("username").value.trim();
        const pass = document.getElementById("password").value.trim();
        const btn = document.getElementById("loginBtn");
        const err = document.getElementById("errorMsg");
        err.style.display = "none";
        btn.textContent = "⏳ Signing in…";
        btn.classList.add("loading");
        setTimeout(() => {
          if (user === "admin" && pass === "campus123") {
            btn.textContent = "✅ Success! Redirecting…";
            setTimeout(
              () => (window.location.href = "admin-dashboard.html"),
              800,
            );
          } else {
            btn.textContent = "🔐 Sign In to Admin Panel";
            btn.classList.remove("loading");
            document.getElementById("errorText").textContent =
              user === ""
                ? "Please enter your username."
                : pass === ""
                  ? "Please enter your password."
                  : "Invalid credentials. Use admin / campus123 for demo.";
            err.style.display = "flex";
          }
        }, 900);
      }
    </script>
  </body>
</html>
