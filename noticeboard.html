<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticeboard — Campus Notice Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0A1628;--blue:#1565C0;--blue-mid:#1976D2;--blue-light:#42A5F5;--cyan:#00BCD4;--cyan-light:#80DEEA;--white:#FFFFFF;--gray-50:#F8FAFC;--gray-100:#EEF2F7;--gray-200:#E2E8F0;--gray-400:#94A3B8;--gray-600:#475569;--gray-800:#1E293B;--radius:16px;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--gray-50);color:var(--gray-800);}
  nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,22,40,0.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.07);}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;}
  .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
  .nav-logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--cyan),var(--blue-light));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
  .nav-logo-text{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:var(--white);}
  .nav-logo-text span{color:var(--cyan);}
  .nav-links{display:flex;align-items:center;gap:8px;}
  .nav-links a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;transition:all 0.2s;}
  .nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,255,255,0.1);}
  .nav-cta{background:linear-gradient(135deg,var(--cyan),var(--blue-light));color:var(--navy)!important;font-weight:700!important;padding:8px 18px!important;border-radius:20px!important;}

  /* PAGE HEADER */
  .page-header{background:linear-gradient(135deg,#0A1628 0%,#1565C0 100%);padding:100px 24px 48px;position:relative;overflow:hidden;}
  .page-header::after{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0h60v60H0z' fill='none'/%3E%3Ccircle cx='30' cy='30' r='1' fill='rgba(255,255,255,0.05)'/%3E%3C/svg%3E");}
  .ph-inner{max-width:1200px;margin:0 auto;position:relative;z-index:2;}
  .ph-inner h1{font-family:'Sora',sans-serif;font-size:clamp(28px,4vw,44px);font-weight:800;color:var(--white);letter-spacing:-1px;margin-bottom:8px;}
  .ph-inner p{color:rgba(255,255,255,0.6);font-size:16px;}

  /* SEARCH & FILTER */
  .controls{max-width:1200px;margin:0 auto;padding:28px 24px 0;}
  .search-wrap{position:relative;margin-bottom:20px;}
  .search-wrap input{width:100%;padding:14px 20px 14px 50px;border:2px solid var(--gray-200);border-radius:50px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--gray-800);background:var(--white);outline:none;transition:all 0.25s;box-shadow:0 2px 12px rgba(0,0,0,0.06);}
  .search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,188,212,0.12);}
  .search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:18px;opacity:0.4;}
  .search-clear{position:absolute;right:18px;top:50%;transform:translateY(-50%);background:var(--gray-200);border:none;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;display:none;align-items:center;justify-content:center;color:var(--gray-600);}
  .filter-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .filter-btn{padding:8px 18px;border-radius:20px;border:2px solid var(--gray-200);background:var(--white);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--gray-600);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;}
  .filter-btn:hover{border-color:var(--blue-light);color:var(--blue);}
  .filter-btn.active{background:var(--blue);border-color:var(--blue);color:var(--white);}
  .filter-btn.active[data-cat="Exams"]{background:#F57C00;border-color:#F57C00;}
  .filter-btn.active[data-cat="Events"]{background:#388E3C;border-color:#388E3C;}
  .filter-btn.active[data-cat="Placements"]{background:#1976D2;border-color:#1976D2;}
  .filter-btn.active[data-cat="Clubs"]{background:#7B1FA2;border-color:#7B1FA2;}
  .filter-btn.active[data-cat="General"]{background:#00838F;border-color:#00838F;}
  .results-info{font-size:13px;color:var(--gray-400);padding:8px 0 16px;}

  /* NOTICES GRID */
  .notices-section{max-width:1200px;margin:0 auto;padding:0 24px 80px;}
  .notices-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .notice-card{background:var(--white);border:1.5px solid var(--gray-200);border-radius:var(--radius);padding:22px;transition:all 0.3s;cursor:pointer;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;}
  .notice-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--cyan));opacity:0;transition:opacity 0.3s;}
  .notice-card:hover{transform:translateY(-5px);box-shadow:0 12px 40px rgba(21,101,192,0.14);border-color:#42A5F5;}
  .notice-card:hover::before{opacity:1;}
  .nc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .np-tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
  .tag-exam{background:#FFF3E0;color:#E65100;}
  .tag-event{background:#E8F5E9;color:#1B5E20;}
  .tag-place{background:#E3F2FD;color:#0D47A1;}
  .tag-club{background:#F3E5F5;color:#4A148C;}
  .tag-general{background:#E0F7FA;color:#006064;}
  .nc-date{font-size:11px;color:var(--gray-400);white-space:nowrap;}
  .nc-title{font-family:'Sora',sans-serif;font-size:15px;font-weight:700;color:var(--navy);line-height:1.4;}
  .nc-desc{font-size:13px;color:var(--gray-600);line-height:1.65;flex:1;}
  .nc-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--gray-100);}
  .nc-author{font-size:11px;color:var(--gray-400);display:flex;align-items:center;gap:4px;}
  .nc-read{font-size:12px;font-weight:700;color:var(--blue-mid);cursor:pointer;background:none;border:none;display:flex;align-items:center;gap:4px;}
  .nc-read:hover{color:var(--cyan);}
  .no-results{text-align:center;padding:60px 20px;color:var(--gray-400);}
  .no-results .nr-icon{font-size:48px;margin-bottom:12px;}
  .no-results h3{font-family:'Sora',sans-serif;font-size:18px;color:var(--gray-600);margin-bottom:6px;}

  /* MODAL */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,22,40,0.7);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.3s;}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--white);border-radius:20px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,0.25);transform:scale(0.95);transition:transform 0.3s;}
  .modal-overlay.open .modal{transform:scale(1);}
  .modal-header{background:linear-gradient(135deg,#0A1628,#1565C0);padding:24px 28px;border-radius:20px 20px 0 0;position:relative;}
  .modal-tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.9);margin-bottom:12px;}
  .modal-title{font-family:'Sora',sans-serif;font-size:20px;font-weight:800;color:var(--white);line-height:1.35;}
  .modal-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.15);border:none;border-radius:8px;width:32px;height:32px;cursor:pointer;color:white;font-size:18px;display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:rgba(255,255,255,0.25);}
  .modal-body{padding:24px 28px;}
  .modal-meta{display:flex;gap:20px;margin-bottom:16px;flex-wrap:wrap;}
  .meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gray-600);}
  .modal-desc{font-size:15px;color:var(--gray-700);line-height:1.75;margin-bottom:20px;}
  .modal-attach{display:flex;align-items:center;gap:10px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:12px 16px;}
  .attach-icon{font-size:24px;}
  .attach-info{flex:1;}
  .attach-name{font-size:13px;font-weight:600;color:var(--navy);}
  .attach-size{font-size:11px;color:var(--gray-400);}
  .attach-btn{background:var(--blue);color:var(--white);border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;}

  @media(max-width:900px){.notices-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.notices-grid{grid-template-columns:1fr;}.nav-links{display:none;}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-icon">📋</div>
      <div class="nav-logo-text">Campus<span>Hub</span></div>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="noticeboard.html" class="active">Notices</a>
      <a href="admin-login.html" class="nav-cta">Admin Login</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="ph-inner">
    <h1>📋 Campus Noticeboard</h1>
    <p>Browse all announcements — search, filter, and stay informed.</p>
  </div>
</div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search notices by title, category, or keyword…" oninput="applyFilters()">
    <button class="search-clear" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
  <div class="filter-row">
    <button class="filter-btn active" data-cat="All" onclick="setFilter('All',this)">🗂️ All</button>
    <button class="filter-btn" data-cat="Exams" onclick="setFilter('Exams',this)">📝 Exams</button>
    <button class="filter-btn" data-cat="Events" onclick="setFilter('Events',this)">🎉 Events</button>
    <button class="filter-btn" data-cat="Placements" onclick="setFilter('Placements',this)">💼 Placements</button>
    <button class="filter-btn" data-cat="Clubs" onclick="setFilter('Clubs',this)">🎭 Clubs</button>
    <button class="filter-btn" data-cat="General" onclick="setFilter('General',this)">📢 General</button>
  </div>
  <div class="results-info" id="resultsInfo"></div>
</div>

<div class="notices-section">
  <div class="notices-grid" id="noticesGrid"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <div class="modal-tag" id="mTag"></div>
      <h2 class="modal-title" id="mTitle"></h2>
      <button class="modal-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-meta" id="mMeta"></div>
      <p class="modal-desc" id="mDesc"></p>
      <div class="modal-attach" id="mAttach" style="display:none">
        <div class="attach-icon">📄</div>
        <div class="attach-info">
          <div class="attach-name" id="mFileName"></div>
          <div class="attach-size">PDF · 245 KB</div>
        </div>
        <button class="attach-btn">Download</button>
      </div>
    </div>
  </div>
</div>

<script>
const NOTICES = [
  {id:1,title:"Mid-Semester Examination Schedule Released",date:"May 28, 2025",category:"Exams",tag:"tag-exam",emoji:"📝",desc:"The Controller of Examinations has released the complete mid-semester timetable for all departments. All students are advised to download the schedule from the examination portal and plan accordingly. Hall tickets will be issued 3 days before the exam.",author:"Controller of Examinations",hasFile:true,file:"MidSem_Schedule_2025.pdf"},
  {id:2,title:"Infosys Campus Recruitment Drive",date:"May 25, 2025",category:"Placements",tag:"tag-place",emoji:"💼",desc:"Infosys is visiting our campus on June 15, 2025 for System Engineer and Digital Specialist Engineer roles. CSE, IT, and ECE final year students with 60%+ aggregate (no active backlogs) are eligible. Pre-placement talk at 10 AM in the auditorium.",author:"Training & Placement Cell",hasFile:true,file:"Infosys_Drive_Details.pdf"},
  {id:3,title:"Annual Tech Fest 'Nexus 2025' Registration Open",date:"May 22, 2025",category:"Events",tag:"tag-event",emoji:"🎉",desc:"Registrations are now open for Nexus 2025, our flagship tech festival. Events include 24-hour Hackathon, AI Paper Presentation, IoT Workshop, and Robo-Wars. Register before June 5 through the student portal. Early registrants get free T-shirts.",author:"Student Affairs Department",hasFile:false},
  {id:4,title:"Photography Club Open Auditions",date:"May 20, 2025",category:"Clubs",tag:"tag-club",emoji:"🎭",desc:"The Photography Club is looking for passionate new members. No prior experience needed — just your eye for a great shot. Submit a portfolio of 5 photos to photographyclub@campus.edu by May 30. Selections announced June 2.",author:"Arts & Cultural Committee",hasFile:false},
  {id:5,title:"Central Library Closed — May 31",date:"May 18, 2025",category:"General",tag:"tag-general",emoji:"📢",desc:"The central library will remain closed on May 31st (Saturday) due to annual maintenance and stock verification. Digital library resources and the e-journal portal will remain accessible 24/7. Apologies for any inconvenience.",author:"Library Administration",hasFile:false},
  {id:6,title:"GATE 2026 Preparation Workshop",date:"May 16, 2025",category:"Exams",tag:"tag-exam",emoji:"📝",desc:"A 3-day intensive GATE 2026 preparation workshop is scheduled for June 10–12 in Room 301, Academic Block. Topics: Engineering Mathematics, Aptitude, and core subjects. Pre-final and final year students can register at the Academic Affairs office before June 1.",author:"Academic Affairs Cell",hasFile:true,file:"GATE_Workshop_Brochure.pdf"},
  {id:7,title:"Google Internship Opportunity — Summer 2025",date:"May 14, 2025",category:"Placements",tag:"tag-place",emoji:"💼",desc:"Google has reached out for summer internship openings in their Hyderabad office. Pre-final year students from CSE and IT with strong DSA skills may apply. Submit your updated resume to tpc@campus.edu by May 25.",author:"T&P Cell",hasFile:false},
  {id:8,title:"Blood Donation Camp — June 3",date:"May 12, 2025",category:"Events",tag:"tag-event",emoji:"🎉",desc:"NSS and the Red Cross Society are organizing a blood donation camp on June 3rd in the college grounds. Volunteer registrations open. All donors will receive certificates and a meal coupon. Walk-ins welcome between 9 AM and 4 PM.",author:"NSS Cell",hasFile:false},
  {id:9,title:"Debate Club — Inter-College Championship Tryouts",date:"May 10, 2025",category:"Clubs",tag:"tag-club",emoji:"🎭",desc:"The Debate Club is selecting 6 students to represent the college at the State-Level Inter-College Debate Championship. Tryouts on May 28 at 2 PM, Seminar Hall 2. Topic list will be shared on the day. Open to all years.",author:"Debate & Elocution Club",hasFile:false},
  {id:10,title:"Fee Payment Deadline — Last Reminder",date:"May 8, 2025",category:"General",tag:"tag-general",emoji:"📢",desc:"This is a final reminder for students who have not paid semester fees. The last date for fee payment without late penalty is May 20, 2025. Students with dues will not be permitted to appear in mid-semester exams. Contact the accounts office immediately.",author:"Accounts Section",hasFile:false},
  {id:11,title:"Anti-Ragging Committee Notice",date:"May 5, 2025",category:"General",tag:"tag-general",emoji:"📢",desc:"The Anti-Ragging Committee reminds all students that ragging in any form is a punishable offense. Incidents may be reported on the helpline 1800-XXX-XXXX or via the anonymous reporting portal. A zero-tolerance policy is strictly enforced.",author:"Anti-Ragging Committee",hasFile:false},
  {id:12,title:"Sports Meet 2025 — Event Schedule",date:"May 3, 2025",category:"Events",tag:"tag-event",emoji:"🎉",desc:"The Annual Sports Meet is scheduled for June 20–22. Events include Cricket, Football, Badminton, Athletics, and Chess. Students must register through their department sports coordinator before June 10. Prizes worth ₹50,000 up for grabs!",author:"Physical Education Dept.",hasFile:true,file:"SportsMeet_Schedule.pdf"},
];

let currentFilter = 'All';
let currentSearch = '';

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  currentSearch = q;
  document.getElementById('clearBtn').style.display = q ? 'flex' : 'none';
  const filtered = NOTICES.filter(n => {
    const matchCat = currentFilter === 'All' || n.category === currentFilter;
    const matchQ = !q || n.title.toLowerCase().includes(q) || n.desc.toLowerCase().includes(q) || n.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderNotices(filtered);
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  applyFilters();
}

function renderNotices(list) {
  const grid = document.getElementById('noticesGrid');
  document.getElementById('resultsInfo').textContent = `Showing ${list.length} notice${list.length !== 1 ? 's' : ''}${currentFilter !== 'All' ? ' in ' + currentFilter : ''}${currentSearch ? ' matching "' + currentSearch + '"' : ''}`;
  if (!list.length) {
    grid.innerHTML = `<div class="no-results" style="grid-column:1/-1"><div class="nr-icon">🔍</div><h3>No notices found</h3><p>Try a different search term or category.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(n => `
    <div class="notice-card" onclick="openModal(${n.id})">
      <div class="nc-top">
        <span class="np-tag ${n.tag}">${n.emoji} ${n.category}</span>
        <span class="nc-date">${n.date}</span>
      </div>
      <div class="nc-title">${n.title}</div>
      <div class="nc-desc">${n.desc.substring(0,110)}…</div>
      <div class="nc-footer">
        <span class="nc-author">👤 ${n.author}</span>
        <button class="nc-read">Read more →</button>
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  const n = NOTICES.find(x => x.id === id);
  if (!n) return;
  document.getElementById('mTag').textContent = n.emoji + ' ' + n.category;
  document.getElementById('mTitle').textContent = n.title;
  document.getElementById('mMeta').innerHTML = `
    <span class="meta-item">📅 ${n.date}</span>
    <span class="meta-item">👤 ${n.author}</span>
    <span class="meta-item">🏷️ ${n.category}</span>
  `;
  document.getElementById('mDesc').textContent = n.desc;
  const attachEl = document.getElementById('mAttach');
  if (n.hasFile) {
    attachEl.style.display = 'flex';
    document.getElementById('mFileName').textContent = n.file;
  } else {
    attachEl.style.display = 'none';
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
}

// Load from admin storage
function loadAdminNotices() {
  const stored = localStorage.getItem('campusNotices');
  if (stored) {
    const adminNotices = JSON.parse(stored);
    adminNotices.forEach(n => {
      if (!NOTICES.find(x => x.id === n.id)) NOTICES.unshift(n);
    });
  }
}

loadAdminNotices();
applyFilters();
</script>
</body>
</html>
